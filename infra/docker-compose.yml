name: clubes

services:
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: nginx_web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # el frontend se sirve desde /opt/clubes/ dentro de la imagen (ver frontend/Dockerfile)
    depends_on:
      - ms-bff
      - keycloak
    restart: unless-stopped

  ms-bff:
    build:
      context: ../backend/ms-bff
      additional_contexts:
        certs: ./nginx/ssl
      dockerfile: Dockerfile
    container_name: ms-bff
    ports:
      - "9001:9001"
    environment:
      KEYCLOAK_ISSUER_URI: https://clubes.local/auth/realms/clubes
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/clubes/protocol/openid-connect/certs
      MS_BACKEND_URL: http://ms-backend:9003/backend
      MS_CONECTOR_URL: http://ms-conector:9002/conector
    depends_on:
      - ms-backend
    restart: unless-stopped

  ms-backend:
    build:
      context: ../backend/ms-backend
      additional_contexts:
        certs: ./nginx/ssl
      dockerfile: Dockerfile
    container_name: ms-backend
    ports:
      - "9003:9003"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ISSUER_URI: https://clubes.local/auth/realms/clubes
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/clubes/protocol/openid-connect/certs
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-clubes_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    restart: unless-stopped

  ms-conector:
    build:
      context: ../backend/ms-conector
      additional_contexts:
        certs: ./nginx/ssl
      dockerfile: Dockerfile
    container_name: ms-conector
    ports:
      - "9004:9002"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KEYCLOAK_DB: ${KEYCLOAK_DB:?Set KEYCLOAK_DB in .env}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak-server
    environment:
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_RELATIVE_PATH: auth
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER in .env}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB:?Set KEYCLOAK_DB in .env}
    command: ["start", "--import-realm"]
    volumes:
      - ./keycloak/clubes-realm.json:/opt/keycloak/data/import/clubes-realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4_ui
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      # pgAdmin rejects IANA special-use domains (.local) for PGADMIN_DEFAULT_EMAIL.
      # Allow "local" so the default example address keeps working locally.
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local']"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
