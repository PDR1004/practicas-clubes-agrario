name: CI — Verificación Frontend y Backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend-build:
    name: React Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-test:
    name: Spring Boot Microservices Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [dacs-bff, dacs-backend, dacs-conector]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Compile ${{ matrix.service }}
        working-directory: backend/${{ matrix.service }}
        run: mvn -B -DskipTests -Dmaven.gitcommitid.skip=true test-compile
