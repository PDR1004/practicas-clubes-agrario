server:
  port: 9003
  servlet:
    context-path: /backend

spring:
  application:
    name: ms-backend
  profiles:
    default: local
  datasource:
    # En Docker el Compose inyecta SPRING_DATASOURCE_* apuntando a postgres:5432.
    # Los defaults son para correr desde el IDE contra el puerto publicado del host.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/clubes_db}
    username: ${SPRING_DATASOURCE_USERNAME:clubes}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://clubes.local/auth/realms/clubes}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/auth/realms/clubes/protocol/openid-connect/certs}
